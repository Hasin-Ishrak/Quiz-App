name: Android Release

# Builds the release APK and publishes it as the only asset on a GitHub Release.
#
# BUILD-TIME ENVIRONMENT
# ----------------------
# Values are injected with --dart-define, so they are compiled into the APK.
# Read them in Dart with String.fromEnvironment, e.g.
#
#     static const String _baseUrl = String.fromEnvironment(
#       'QUIZ_API_BASE_URL',
#       defaultValue: 'https://opentdb.com/api.php',
#     );
#
# Provide them either way (BUILD_ENV wins if both are set):
#
#   1. Repository secret BUILD_ENV - a JSON object, the flexible option.
#      Settings -> Secrets and variables -> Actions -> New repository secret
#
#          {
#            "QUIZ_API_BASE_URL": "https://opentdb.com/api.php",
#            "BDAPPS_BASE_URL":   "https://www.bdappsdigitalapps.com/Hasin46/"
#          }
#
#      Add new keys here without ever touching this workflow again.
#
#   2. Individual repository variables/secrets, wired in the build step below.
#
# If neither is set the build still succeeds and every value falls back to the
# defaultValue baked into the Dart source.
#
# NOTE: --dart-define values are embedded in the shipped binary and can be
# extracted from it. Use this for config (URLs, flavours, feature flags), never
# for anything that must stay private, like a signing key or a server secret.
#
# SIGNING
# -------
# android/app/build.gradle.kts still has
# `release { signingConfig = signingConfigs.getByName("debug") }`, so this APK
# is debug-signed: fine to sideload, rejected by Google Play.
#
# Trigger: push a tag `git tag v1.0.0 && git push origin v1.0.0`
#          or Actions -> Android Release -> Run workflow

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to publish, e.g. v1.0.0"
        required: true
      prerelease:
        description: "Mark this release as a pre-release"
        type: boolean
        required: false
        default: true
      flutter_version:
        description: "Exact Flutter version (leave blank for latest stable)"
        required: false
        default: ""

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # required to create the release and upload the APK

defaults:
  run:
    working-directory: client_app

jobs:
  release:
    name: Build and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${VERSION}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ github.event.inputs.flutter_version }}
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('client_app/android/**/*.gradle*', 'client_app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Print toolchain versions
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Assemble the --dart-define arguments. Anything absent is simply omitted
      # so the Dart-side defaultValue survives; an empty secret must never be
      # allowed to overwrite a good default with "".
      - name: Prepare build environment
        id: env
        env:
          BUILD_ENV: ${{ secrets.BUILD_ENV }}
          QUIZ_API_BASE_URL: ${{ vars.QUIZ_API_BASE_URL }}
          BDAPPS_BASE_URL: ${{ vars.BDAPPS_BASE_URL }}
        run: |
          if [ -n "$BUILD_ENV" ]; then
            printf '%s' "$BUILD_ENV" > dart_defines.json
            if ! jq empty dart_defines.json 2>/dev/null; then
              echo "::error::secret BUILD_ENV is not valid JSON"
              exit 1
            fi
            echo "Injecting $(jq 'keys | length' dart_defines.json) value(s) from BUILD_ENV:"
            jq -r 'keys[] | "  - " + .' dart_defines.json   # names only, never values
            echo "args=--dart-define-from-file=dart_defines.json" >> "$GITHUB_OUTPUT"
          else
            ARGS=""
            for name in QUIZ_API_BASE_URL BDAPPS_BASE_URL; do
              value="${!name}"
              if [ -n "$value" ]; then
                ARGS="$ARGS --dart-define=$name=$value"
                echo "  - $name (from repository variable)"
              fi
            done
            if [ -z "$ARGS" ]; then
              echo "No build environment configured; using the defaults compiled into the Dart source."
            fi
            echo "args=$ARGS" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        run: flutter build apk --release ${{ steps.env.outputs.args }}

      - name: Rename APK
        id: apk
        run: |
          NAME="quiz-app-${{ steps.version.outputs.version }}.apk"
          mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${NAME}"
          echo "path=client_app/build/app/outputs/flutter-apk/${NAME}" >> "$GITHUB_OUTPUT"
          ls -lh "build/app/outputs/flutter-apk/${NAME}"

      - name: Remove build environment file
        if: always()
        run: rm -f dart_defines.json

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Quiz App ${{ steps.version.outputs.version }}
          prerelease: ${{ github.event.inputs.prerelease != 'false' }}
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            ## Quiz App ${{ steps.version.outputs.version }}

            Release APK built by the `Android Release` workflow from `${{ github.sha }}`
            with build-time configuration injected via `--dart-define`.

            > Signed with the debug keystore - fine to sideload, rejected by Google Play.
            > Add a release signing config before shipping.
